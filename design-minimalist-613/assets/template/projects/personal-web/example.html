<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>这是一个个人主页｜公开示例</title>
<style>
:root{
  --canvas-w:1440px;--canvas-h:920px;
  --paper:#F8F6F7;--white:#FFFFFF;--ink:#30363D;--text:#59616A;--muted:#8A929B;--border:#E6E8EA;
  --purple-100:#EEE8F5;--purple-300:#DDD2EB;--purple-500:#CEBFE2;--purple-700:#9B88B3;
  --green-300:#CADECA;--orange-300:#EBD2C2;
  --font:"PingFang SC","Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
  --display:300 96px/1.03 var(--font);--h2:500 22px/1.3 var(--font);--body:400 16px/1.6 var(--font);
  --label:600 12px/1.35 var(--font);--note:400 13px/1.5 var(--font)
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{width:100%;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font)}
body{overflow:auto}.page{position:relative;width:var(--canvas-w);height:var(--canvas-h);margin:0 auto;background:var(--paper);overflow:hidden}
.topbar{position:absolute;z-index:5;left:60px;right:60px;top:16px;height:56px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.92);border:1px solid var(--border)}
.brand{font:var(--label);letter-spacing:.12em}.brand b{display:inline-flex;margin-left:8px;padding:7px 6px;background:var(--purple-300)}
.nav{display:flex;gap:32px;color:var(--text);font:var(--note)}.nav span:first-child{padding-bottom:8px;border-bottom:2px solid var(--purple-700);color:var(--ink)}
.hero{position:relative;width:100%;height:100%;padding:148px 80px 80px;display:grid;grid-template-columns:1.05fr .95fr;gap:72px}
.hero-copy{display:flex;flex-direction:column;align-items:flex-start}.hero-kicker{display:flex;align-items:center;gap:12px;margin-top:8px;font:var(--label);letter-spacing:.14em}.live-dot{width:8px;height:8px;background:#9AB99B;border-radius:50%}
h1{margin-top:30px;font:var(--display);letter-spacing:-.03em}h1 em{display:block;color:var(--purple-700);font:inherit;font-style:normal}
.hero-belief{margin-top:30px;padding:12px 16px;border-left:4px solid var(--purple-700);background:var(--purple-100);color:var(--text);font:var(--body)}.hero-belief strong{color:var(--ink);font-weight:600}
.primary-action{display:inline-flex;align-items:center;gap:24px;margin-top:28px;padding:15px 20px;background:var(--ink);color:#fff;font:400 14px/1.5 var(--font);text-decoration:none}.primary-action b{font-size:18px;font-weight:400}
.hero-tags{display:flex;gap:10px;margin-top:32px}.hero-tags span{padding:9px 12px;border:1px solid var(--border);background:#fff;font:var(--note)}
.hero-intro{width:100%;margin-top:28px;padding-top:24px;border-top:1px solid var(--border);color:var(--text);font:var(--body)}.hero-intro strong{color:var(--ink);font-weight:600}
.portrait-stage{position:relative;min-width:0;height:650px}.portrait-orbit{position:absolute;border:1px dashed}.orbit-one{width:560px;height:560px;left:8px;top:82px;border-color:var(--purple-500);border-radius:50%}.orbit-two{width:470px;height:610px;left:66px;top:28px;border-color:#AFCDAF;border-radius:50%;transform:rotate(9deg)}
.portrait-frame{position:absolute;z-index:2;left:88px;top:36px;width:430px;height:570px;padding:12px;background:#fff;transform:rotate(1.8deg)}.portrait-frame img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 50%}
.portrait-note{position:absolute;z-index:3;padding:11px 14px;background:#fff;border:1px solid var(--border);font:var(--label);letter-spacing:.08em}.note-one{right:4px;top:86px}.note-two{left:0;bottom:110px}
.platform-ticket{position:absolute;z-index:4;right:-2px;bottom:64px;width:410px;height:70px;padding:12px 16px;display:grid;grid-template-columns:1fr 32px 1fr;align-items:center;background:#F5E8E0;border:1px solid #B7837E;transform:rotate(-2deg)}.platform-ticket small{display:block;color:var(--muted);font:600 9px/1.2 var(--font);letter-spacing:.08em}.platform-ticket strong{display:block;margin-top:4px;font:600 11px/1.2 var(--font)}.platform-ticket i{text-align:center;font-style:normal;color:var(--purple-700)}
.coordinate{position:absolute;right:12px;top:0;color:var(--muted);font:400 11px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right}
@media(max-width:900px){.page{margin:0;transform-origin:top left;transform:scale(calc(100vw / 1440));height:920px}}
@page{size:1440px 920px;margin:0}@media print{html,body{width:1440px;height:920px;background:var(--paper)}.page{margin:0;transform:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="topbar"><div class="brand">PORTFOLIO TEMPLATE <b>0613</b></div><nav class="nav"><span>首页</span><span>作品</span><span>方法</span><span>联系</span></nav></header>
  <section class="hero" aria-labelledby="hero-title">
    <div class="hero-copy">
      <div class="hero-kicker"><span class="live-dot"></span>PERSONAL PAGE · PUBLIC TEMPLATE</div>
      <h1 id="hero-title">这是一个<em>个人主页</em></h1>
      <p class="hero-belief">把你的介绍放在这里，<strong>内容可自由替换</strong></p>
      <span class="primary-action">查看页面示例 <b>↘</b></span>
      <div class="hero-tags"><span>项目一</span><span>项目二</span><span>项目三</span></div>
      <p class="hero-intro">公开示例只展示首屏结构、字体节奏与图文比例。标题、栏目和人物图片均为通用占位内容，不对应真实身份与经历。</p>
    </div>
    <div class="portrait-stage" aria-label="匿名人物资产">
      <div class="portrait-orbit orbit-one"></div><div class="portrait-orbit orbit-two"></div>
      <div class="portrait-frame"><img src="assets/portrait.png" alt="匿名人物插画"></div>
      <div class="portrait-note note-one">○ PUBLIC TEMPLATE</div><div class="portrait-note note-two">✦ IMAGE PLACEHOLDER</div>
      <div class="platform-ticket"><div><small>PAGE TYPE</small><strong>PORTFOLIO · HERO</strong></div><i>→</i><div><small>NEXT STEP</small><strong>REPLACE CONTENT</strong></div></div>
      <div class="coordinate">CANONICAL CANVAS<br>1440 × 920</div>
    </div>
  </section>
</main>
</body>
</html>
